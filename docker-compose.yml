services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    image: seeker-app:latest          # tag the built image so celery/beat can reuse it
    container_name: seeker-django
    env_file:
      - .env.local
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - .:/app                         # mounts source for live code edits
    ports:
      - "8000:8000"
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8000/api/accounts/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - seeker-network

  postgres:
    image: postgres:16-alpine
    container_name: seeker-postgres
    environment:
      POSTGRES_DB: seekerdb
      POSTGRES_USER: seeker
      POSTGRES_PASSWORD: seekerpass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeker -d seekerdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - seeker-network

  redis:
    image: redis:7-alpine
    container_name: seeker-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - seeker-network

  celery:
    image: seeker-app:latest             # reuses the image built by the django service
    container_name: seeker-celery
    env_file:
      - .env.local
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - .:/app
    command: celery -A config worker --loglevel=info
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"print('ok')\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - seeker-network

  celery-beat:
    image: seeker-app:latest             # reuses the image built by the django service
    container_name: seeker-celery-beat
    env_file:
      - .env.local
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - .:/app
    command: celery -A config beat --loglevel=info
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"print('ok')\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - seeker-network

  flower:
    image: mher/flower:2.0
    container_name: seeker-flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:5555'', timeout=2)"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - seeker-network

  minio:
    image: minio/minio:latest
    container_name: seeker-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - seeker-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: seeker-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8025 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - seeker-network

  typesense:
    image: typesense/typesense:0.25.2
    container_name: seeker-typesense
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: local-typesense-key
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense-data:/data
    ports:
      - "8108:8108"
    command: --data-dir /data --api-key=local-typesense-key --enable-cors
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep '[t]ypesense-server'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - seeker-network

  nextjs:
    image: node:20-alpine
    container_name: seeker-nextjs
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: >
      sh -c "
        if [ -f package.json ]; then
          npm install && npm run dev -- --hostname 0.0.0.0;
        else
          node -e \"const http=require('http'); http.createServer((req,res)=>{res.end('Seeker Next.js placeholder running until public profiles are scaffolded\\n')}).listen(3000,'0.0.0.0')\";
        fi
      "
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - seeker-network

volumes:
  postgres-data:
  redis-data:
  minio-data:
  typesense-data:

networks:
  seeker-network:
    driver: bridge
